name: Deploy DataVisionAPI to ECS Fargate

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write   # requerido para pedir el token OIDC a GitHub
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: weather-api
  ECS_CLUSTER: weather-api-cluster
  ECS_SERVICE: weather-api-service
  CONTAINER_NAME: api               # debe matchear el "name" del contenedor en task-definition.json
  TASK_DEFINITION_FILE: .aws/task-definition.json

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # OIDC: GitHub emite un JWT de corta duración, AWS lo cambia por
      # credenciales temporales. No hay access keys guardadas en ningún lado.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
                        -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # Toma task-definition.json, reemplaza SOLO la imagen del contenedor
      # "api" por la recién construida. El contenedor "db" (SQL Server, con
      # tag fijo 2022) queda intacto.
      - name: Render new task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEFINITION_FILE }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
