services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      EnableSwagger: "true"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=DataVisionDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=true;MultipleActiveResultSets=true"
      JwtSettings__SecretKey: ${JWT_SECRET}
      JwtSettings__Issuer: DataVisionAPI
      JwtSettings__Audience: DataVisionClients
      JwtSettings__ExpiryInHours: "24"
      OpenWeatherMap__ApiKey: ${OWM_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s